<!DOCTYPE html>
<html>
<head>
    <title>Zac's Pizza Restaurant | Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: sans-serif;">
    <header>
        <h2>Zac's Pizza Restaurant</h2>
    </header>
    <nav>
        <button onClick="window.location.href='index.html'">Home</button>
        <button style="background-color: lightgrey;">Menu</button>
        <button onClick="window.location.href='order.html'">Order</button>
    </nav>
    <main>
        <h1>Menu</h1>
        <form id="menuForm">
            <h2>Burgers:</h2>
            <div class="menuSection">
                    <div class="menuBox" onclick="AddToCart('Cheeseburger')">
                        <label>Cheeseburger</label><br>
                        <img src='https://t4.ftcdn.net/jpg/05/42/03/95/360_F_542039547_HWxq6bCIDHoH5BiQNyPwC2Kp4NBQL2qL.jpg'>
                    </div>
                <div class="menuBox" onclick="AddToCart('Double Cheeseburger')">
                    <label>Double Cheeseburger</label><br>
                    <img src='https://t3.ftcdn.net/jpg/15/18/73/92/360_F_1518739202_L6sBBeFTvPYPawBVabVZ75jfFjqUy3ob.jpg'>
                </div>
                <div class="menuBox" onclick="AddToCart('Chicken Burger')">
                    <label>Chicken Burger</label><br>
                    <img src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQub2-Jy3lAShn7oYzBHpbKDSm_Yd2fApKWZw&s'>
                </div>
            </div>
            <h2>Sides:</h2>
            <div class="menuSection">
                <div class="menuBox" onclick="AddToCart('Fries')">
                    <label>Fries</label><br>
                    <img src='https://cdn.britannica.com/34/206334-050-7637EB66/French-fries.jpg'>
                </div>
            </div>
            <h2>Drinks:</h2>
            <div class="menuSection">
                <div class="menuBox" onclick="AddToCart('Coke')">
                    <label>Coke</label><br>
                    <img src='https://t4.ftcdn.net/jpg/03/02/06/91/360_F_302069193_28NB8ujDIqbyrrgfOW9RrFaB4S0QaWlS.jpg'>
                </div>
                <div class="menuBox" onclick="AddToCart('Sprite')">
                    <label>Sprite</label><br>
                    <img src='https://content.wendys.co.nz/f/330482/1000x1000/2036b18fdd/sprite-lge-product-1000.png/m/400x0/filters:quality(90)'>
                </div>
                <div class="menuBox" onclick="AddToCart('Fanta')">
                    <label>Fanta</label><br>
                    <img src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTLvRv5qjVc2-Z7KEGr14W0fBsC8VFDQFHYbg&s'>
                </div>
            </div>
            
            <h2>Desserts:</h2>
            <div class="menuSection">
                <div class="menuBox" onclick="AddToCart('Chocolate Sundae')">
                    <label>Chocolate Sundae</label><br>
                    <img src='https://thumbs.dreamstime.com/b/soft-ice-cream-sundae-vanilla-flavor-chocolate-sauce-isolated-white-serve-syrup-clear-plastic-cup-background-323718905.jpg'>
                </div>
                <div class="menuBox" onclick="AddToCart('Soft Serve')">
                    <label>Soft Serve</label><br>
                    <img src='https://media.istockphoto.com/id/468180280/photo/vanilla-soft-serve-ice-cream-cone.jpg?s=612x612&w=0&k=20&c=ECXCGDLE5daTc18MmUCWCE31k32NyJkMHPf4kA0yM1U='>
                </div>
            </div>
        </form>
        <button onClick="NextPage()" id="doneButton">Done</button>
        <div id="devOutput">
            
        </div>
    </main>
    <footer>Not an actual restaurant. Copyright 2026. etc</footer>
    <script src="script.js"></script>
</body>
</html>
