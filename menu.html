<!DOCTYPE html>
<html>
<head>
    <title>Zac's Pizza Restaurant | Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: sans-serif;">
    <header>
        <h2>Zac's Pizza Restaurant</h2>
    </header>
    <nav>
        <button onClick="window.location.href='index.html'">Home</button>
        <button style="background-color: lightgrey;">Menu</button>
        <button onClick="window.location.href='order.html'">Order</button>
    </nav>
    <main>
        <h1>Menu</h1>
        <form id="menuForm">
            <h2>Pizzas:</h2>
            <div class="menuSection">
                    <div class="menuBox" onclick="AddToCart('Pepperoni Pizza')">
                        <label>Pepperoni Pizza</label><br>
                        <img src='https://t3.ftcdn.net/jpg/10/43/04/38/360_F_1043043872_DhWtj6Jq2l4FjnCXIcPcH1QxSsV0AJWl.jpg'>
                    </div>
                <div class="menuBox" onclick="AddToCart('Cheese Pizza')">
                    <label>Cheese Pizza</label><br>
                    <img src='img.png'>
                </div>
                <div class="menuBox" onclick="AddToCart('Hawaiian Pizza')">
                    <label>Hawaiian Pizza</label><br>
                    <img src='img.png'>
                </div>
            </div>
            <h2>Sides:</h2>
            <div class="menuSection">
                <div class="menuBox" onclick="AddToCart('Fries')">
                    <label>Fries</label><br>
                    <img src='img.png'>
                </div>
            </div>
            <h2>Drinks:</h2>
            <div class="menuSection">
                <div class="menuBox" onclick="AddToCart('Coke')">
                    <label>Coke</label><br>
                    <img src='img.png'>
                </div>
                <div class="menuBox" onclick="AddToCart('Sprite')">
                    <label>Sprite</label><br>
                    <img src='img.png'>
                </div>
                <div class="menuBox" onclick="AddToCart('Fanta')">
                    <label>Fanta</label><br>
                    <img src='img.png'>
                </div>
            </div>
            
            <h2>Desserts:</h2>
            <div class="menuSection">
                <div class="menuBox" onclick="AddToCart('Chocolate Sundae')">
                    <label>Chocolate Sundae</label><br>
                    <img src='img.png'>
                </div>
                <div class="menuBox" onclick="AddToCart('Soft Serve')">
                    <label>Soft Serve</label><br>
                    <img src='img.png'>
                </div>
            </div>
        </form>
        <button onClick="NextPage()" id="doneButton">Done</button>
        <div id="devOutput">
            
        </div>
    </main>
    <footer>Not an actual restaurant. Copyright 2026. etc</footer>
    <script src="menu.js"></script>
</body>
</html>
