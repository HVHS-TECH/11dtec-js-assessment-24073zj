<!DOCTYPE html>
<html>
<head>
    <title>Zac's Pizza Restaurant | Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: sans-serif;">
    <div id="alertbox">
        <p>something happened</p>
        <button id="alert-okay-button" onclick="HideAlert(true)">Okay</button>
        <button id="alert-yes-button" onclick="HideAlert(true)">Yes</button>
        <button id="alert-no-button" onclick="HideAlert(false)">No</button>
    </div>
    <header>
        <h2>Zac's Pizza Restaurant</h2>
    </header>
    <nav>
        <button onClick="window.location.href='index.html'">Home</button>
        <button style="background-color: lightgrey;">Place an Order</button>
        <button onClick="window.location.href='signin.html'">Admin Sign in</button>
    </nav>
    <main>
        <h1>Ordering | Menu</h1>
        <h3>Click on an item to add it to your cart.</h3>
        <!--
            name: "Pepperoni Pizza", price: 7
            name: "Cheese Pizza", price: 6
            name: "Hawaiian Pizza", price: 7
            name: "Fries", price: 3
            name: "Garlic Bread", price: 4
            name: "Coke", price: 3.5
            name: "Sprite", price: 3.5
            name: "Fanta", price: 3.5
        -->
        <form id="menuForm" onsubmit="return false;">
            <button class="dropdown-button" onclick="ToggleSection(1, this);"><h2>Pizzas:</h2><img class="dropdown-arrow" src="Images/arrow.png"></button>
            <div class="menuSection" id="menuSection1">
                <div class="menuBox" onclick="AddToCart('Pepperoni Pizza')">
                    <label>Pepperoni Pizza</label><br>
                    <img src='Images/pepperonipizza.jpg'>
                    <label>$7</label>
                </div>
                <div class="menuBox" onclick="AddToCart('Cheese Pizza')">
                    <label>Cheese Pizza</label><br>
                    <img src='Images/cheesepizza.png'>
                    <label>$6</label>
                </div>
                <div class="menuBox" onclick="AddToCart('Hawaiian Pizza')">
                    <label>Hawaiian Pizza</label><br>
                    <img src='Images/hawaiianpizza.jpg'>
                    <label>$7</label>
                </div>
            </div>
            <button class="dropdown-button" onclick="ToggleSection(2, this);"><h2>Sides:</h2><img class="dropdown-arrow" src="Images/arrow.png"></button>
            <div class="menuSection" id="menuSection2">
                <div class="menuBox" onclick="AddToCart('Fries')">
                    <label>Fries</label><br>
                    <img src='Images/fries.png'>
                    <label>$3</label>
                </div>
                <div class="menuBox" onclick="AddToCart('Garlic Bread')">
                    <label>Garlic Bread</label><br>
                    <img src='Images/garlicbread.png'>
                    <label>$4</label>
                </div>
            </div>
            <button class="dropdown-button" onclick="ToggleSection(3, this);"><h2>Drinks:</h2><img class="dropdown-arrow" src="Images/arrow.png"></button>
            <div class="menuSection" id="menuSection3" type="button">
                <div class="menuBox" onclick="AddToCart('Coke')">
                    <label>Coke</label><br>
                    <img src='Images/coke.jpg'>
                    <label>$3.50</label>
                </div>
                <div class="menuBox" onclick="AddToCart('Sprite')">
                    <label>Sprite</label><br>
                    <img src='Images/sprite.png'>
                    <label>$3.50</label>
                </div>
                <div class="menuBox" onclick="AddToCart('Fanta')">
                    <label>Fanta</label><br>
                    <img src='Images/fanta.jpg'>
                    <label>$3.50</label>
                </div>
            </div>
        </form>
        <button onClick="NextPage()" id="doneButton">Done</button>
        <div id="devOutput">
            
        </div>
    </main>
    <footer>Not an actual restaurant. Copyright 2026. etc</footer>
    <script src="menu.js"></script>
</body>
</html>
