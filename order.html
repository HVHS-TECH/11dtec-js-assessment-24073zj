<!DOCTYPE html>
<html>
<head>
    <title>Zac's Pizza Restaurant | Your Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: sans-serif;">
    <header>
        <h2>Zac's Pizza Restaurant</h2>
    </header>
    <nav>
        <button onClick="window.location.href='index.html'">Home</button>
        <button style="background-color: lightgrey;">Ordering</button>
        <button onClick="window.location.href='signin.html'">Sign in</button>
    </nav>
    <main style="background-color: #e9e9e9;">
        <button onClick="window.location.href='menu.html'">Back</button>

        <h1>Your Order</h1>
        
        <form id="orderForm" onsubmit="return false;">
            <label id="costLabel">Something has gone wrong</label>
            <br>
            <label>What is your name?</label>
            <br>
            <input id="nameInput" type="text">
            <br>
            <label>How much money do you want to input?</label>
            <br>
            <input id="moneyInput" type="text">
            <button  onclick="AutoFill();">Auto</button>
        </form>
        <br>
        <button onclick="OrderShow()">Show Receipt</button>
        <br>
        <br>
        <div id="receipt">
            name: a<br>
            items: b<br>
            totalcost: c<br>
            moneygiven: d<br>
            change: e<br>
        </div>
    </main>
    <footer>Not an actual restaurant. Copyright 2026. etc</footer>
    <script src="order.js"></script>
</body>
</html>
