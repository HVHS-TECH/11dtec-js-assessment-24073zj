<!DOCTYPE html>
<html>
<head>
    <title>Zac's Pizza Restaurant | Backend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: sans-serif;">
    <header>
        <h2>Zac's Pizza Restaurant</h2>
    </header>
    <nav>
        <button onClick="window.location.href='index.html'">Home</button>
        <button onClick="window.location.href='menu.html'">Place an Order</button>
        <button style="background-color: lightgrey;">Backend</button>
    </nav>
    <main>
        <button onClick="window.location.href='signin.html'">Back</button>
        <br><br>
        <h1>The Menu</h1>
        <br>
        <button>Edit Mode</button>
        <form id="menuForm" onsubmit="return false;">
            <button class="dropdown-button"><h2>Pizzas:</h2></button>
            <div class="menuSection" style="display:flex;">
                    <div class="menuBox" onclick="AddToCart('Pepperoni Pizza')">
                        <label>Pepperoni Pizza</label><br>
                        <img src='Images/pepperonipizza.jpg'>
                        <label>$7</label>
                    </div>
                <div class="menuBox" onclick="AddToCart('Cheese Pizza')">
                    <label>Cheese Pizza</label><br>
                    <img src='Images/cheesepizza.png'>
                    <label>$6</label>
                </div>
                <div class="menuBox" onclick="AddToCart('Hawaiian Pizza')">
                    <label>Hawaiian Pizza</label><br>
                    <img src='Images/hawaiianpizza.jpg'>
                    <label>$7</label>
                </div>
            </div>
            <button class="dropdown-button"><h2>Sides:</h2></button>
            <div class="menuSection" style="display:flex;">
                <div class="menuBox" onclick="AddToCart('Fries')">
                    <label>Fries</label><br>
                    <img src='Images/fries.png'>
                    <label>$3</label>
                </div>
                <div class="menuBox" onclick="AddToCart('Garlic Bread')">
                    <label>Garlic Bread</label><br>
                    <img src='Images/garlicbread.png'>
                    <label>$4</label>
                </div>
            </div>
            <button class="dropdown-button"><h2>Drinks:</h2></button>
            <div class="menuSection" style="display:flex;">
                <div class="menuBox" onclick="AddToCart('Coke')">
                    <label>Coke</label><br>
                    <img src='https://t4.ftcdn.net/jpg/03/02/06/91/360_F_302069193_28NB8ujDIqbyrrgfOW9RrFaB4S0QaWlS.jpg'>
                    <label>$3.50</label>
                </div>
                <div class="menuBox" onclick="AddToCart('Sprite')">
                    <label>Sprite</label><br>
                    <img src='https://content.wendys.co.nz/f/330482/1000x1000/2036b18fdd/sprite-lge-product-1000.png/m/400x0/filters:quality(90)'>
                    <label>$3.50</label>
                </div>
                <div class="menuBox" onclick="AddToCart('Fanta')">
                    <label>Fanta</label><br>
                    <img src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTLvRv5qjVc2-Z7KEGr14W0fBsC8VFDQFHYbg&s'>
                    <label>$3.50</label>
                </div>
            </div>
        </form>
    </main>
    <footer>Not an actual restaurant. Copyright 2026. etc</footer>
    <script src="backend.js"></script>
</body>
</html>
