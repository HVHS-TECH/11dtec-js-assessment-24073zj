<!DOCTYPE html>
<html>
<head>
    <title>Zac's Burger Place | Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: sans-serif;">
    <header>
        <h2>Zac's Burger Place</h2>
    </header>
    <nav>
        <button style="background-color: lightgrey;">Menu</button>
        <button onClick="window.location.href='order.html'">Order</button>
    </nav>
    <main>
        <h1>Menu</h1>
        <form id="menuForm">
            <h2>Burgers:</h2>
            <ul>
                <li>
                    <div class="menuBox" onclick="AddToCart('Cheeseburger')">
                        <label>Cheeseburger</label><br>
                        <img src='https://t4.ftcdn.net/jpg/05/42/03/95/360_F_542039547_HWxq6bCIDHoH5BiQNyPwC2Kp4NBQL2qL.jpg'>
                    </div>
                </li>
                <div class="menuBox" onclick="AddToCart('Double Cheeseburger')">
                    <label>Double Cheeseburger</label><br>
                    <img src='https://t3.ftcdn.net/jpg/14/24/95/72/360_F_1424957282_GrlXCov5q0g9TwDgOnV1QwcAfVpd3CIX.jpg'>
                </div>
                <div class="menuBox" onclick="AddToCart('Chicken Burger')">
                    <label>Chicken Burger</label><br>
                    <img src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQub2-Jy3lAShn7oYzBHpbKDSm_Yd2fApKWZw&s'>
                </div>
            </ul>
            <h2>Sides:</h2>
            <ul>
                <li><input type="button" value="Fries" onclick="AddToCart('Fries')"></li>
            </ul>
            <h2>Drinks:</h2>
            <ul>
                <li><input type="button" value="Coke" onclick="AddToCart('Coke')"></li>
                <li><input type="button" value="Sprite" onclick="AddToCart('Sprite')"></li>
                <li><input type="button" value="Fanta" onclick="AddToCart('Fanta')"></li>
            </ul>
            <h2>Desserts:</h2>
            <ul>
                <li><input type="button" value="Chocolate Sundae" onclick="AddToCart('Chocolate Sundae')"></li>
                <li><input type="button" value="Soft Serve" onclick="AddToCart('Soft Serve')"></li>
            </ul>
        </form>
        <button onClick="NextPage()" id="doneButton">Done</button>
        <div id="devOutput">
            
        </div>
    </main>
    <footer>Not an actual restaurant. Copyright 2026. etc</footer>
    <script src="script.js"></script>
</body>
</html>
