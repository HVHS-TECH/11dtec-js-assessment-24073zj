<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: sans-serif;">
    <header>
        <h2>Zac's Burger Place</h2>
    </header>
    <main>
        <h1>Menu</h1>
        <form>
            <h2>Burgers:</h2>
            <ul>
                <li><input type="button" value="Cheeseburger"></li>

            </ul>
            <h2>Sides:</h2>
            <ul>
                <li><input type="button" value="Fries"></li>
            </ul>
            <h2>Drinks:</h2>
            <ul>
                <li><input type="button" value="Coke"></li>
                <li><input type="button" value="Sprite"></li>

        </form>
    </main>
    <footer>Not an actual restaurant. Copyright 2026. etc</footer>
    <script src="script.js"></script>

</html>
